<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — LiquorStore Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      text-align: center;
      padding: 24px;
      gap: 16px;
    }
    .icon { font-size: 64px; }
    h1 { font-size: 22px; font-weight: 700; }
    p { color: #8b949e; font-size: 15px; max-width: 320px; line-height: 1.5; }
    button {
      margin-top: 8px;
      padding: 12px 28px;
      background: #58a6ff;
      color: #0d1117;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">🍾</div>
  <h1>You're offline</h1>
  <p>LiquorStore Pro needs a connection for live data. Your cached orders and products are still available.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
